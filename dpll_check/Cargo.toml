[package]
name = "dpll_check"
version = "0.1.0"
edition = "2021"
default-run = "gpu_ramsey43"
autobins = false

[[bin]]
name = "gpu_ramsey43"
path = "src/bin/gpu_ramsey43.rs"
required-features = ["neuro-trt"]

[dependencies]
# Driver CUDA y NVRTC se cargan en ejecucion; el Toolkit se fija a CUDA 12.6.
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12060"] }
libloading = { version = "0.9.0", optional = true }

[features]
gpu = ["dep:cudarc"]
# Mock CUDA de integración del puente, sin engine TensorRT ni modelo entrenado.
neuro-mock = ["gpu", "dep:libloading"]
# Inferencia TensorRT real; requiere SDK nativo sólo al activar esta feature.
neuro-trt = ["gpu", "dep:libloading"]
# Muestreo residente y exportación por lotes; no requiere el puente mock.
neuro-dataset = ["gpu"]

[profile.release]
debug = false

